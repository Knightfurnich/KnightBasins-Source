openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Public storefront catalog
  - name: admin
    description: Protected catalog administration
  - name: support
    description: Product support assistant
  - name: customer-auth
    description: Customer identity
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /catalog:
    get:
      operationId: getCatalog
      tags: [catalog]
      summary: Get the active storefront catalog
      responses:
        "200":
          description: Current active catalog and prices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [admin]
      summary: Check the current admin session
      responses:
        "200":
          description: Session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
    post:
      operationId: createAdminSession
      tags: [admin]
      summary: Log in to the administration area
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
    delete:
      operationId: deleteAdminSession
      tags: [admin]
      summary: Log out of the administration area
      responses:
        "204":
          description: Logged out
  /admin/basins:
    get:
      operationId: listAdminBasins
      tags: [admin]
      summary: List all basin prices
      responses:
        "200":
          description: Basin prices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BasinPrice"
    post:
      operationId: createAdminBasin
      tags: [admin]
      summary: Create a basin price
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BasinPriceInput"
      responses:
        "201":
          description: Created basin price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasinPrice"
  /admin/basin-categories:
    get:
      operationId: listAdminBasinCategories
      tags: [admin]
      summary: List basin categories
      responses:
        "200":
          description: Basin categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BasinCategory"
    post:
      operationId: createAdminBasinCategory
      tags: [admin]
      summary: Create a basin category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BasinCategoryInput"
      responses:
        "201":
          description: Created basin category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasinCategory"
  /admin/basin-categories/{id}:
    parameters:
      - $ref: "#/components/parameters/RecordId"
    put:
      operationId: updateAdminBasinCategory
      tags: [admin]
      summary: Update or restore a basin category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BasinCategoryInput"
      responses:
        "200":
          description: Updated basin category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasinCategory"
    delete:
      operationId: deleteAdminBasinCategory
      tags: [admin]
      summary: Archive a basin category
      responses:
        "204":
          description: Archived
  /admin/upload/video:
    post:
      operationId: uploadAdminBasinVideo
      tags: [admin]
      summary: Upload a basin video
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
      responses:
        "201":
          description: Uploaded video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedMedia"
  /admin/basins/{id}:
    parameters:
      - $ref: "#/components/parameters/RecordId"
    put:
      operationId: updateAdminBasin
      tags: [admin]
      summary: Update a basin price
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BasinPriceInput"
      responses:
        "200":
          description: Updated basin price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasinPrice"
    delete:
      operationId: deleteAdminBasin
      tags: [admin]
      summary: Delete a basin price
      responses:
        "204":
          description: Deleted
  /admin/installed-stones:
    get:
      operationId: listAdminInstalledStones
      tags: [admin]
      summary: List all installed stone prices
      responses:
        "200":
          description: Installed stone prices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InstalledStonePrice"
    post:
      operationId: createAdminInstalledStone
      tags: [admin]
      summary: Create an installed stone price
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstalledStonePriceInput"
      responses:
        "201":
          description: Created installed stone price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstalledStonePrice"
  /admin/installed-stone-categories:
    get:
      operationId: listAdminInstalledStoneCategories
      tags: [admin]
      summary: List installed stone categories
      responses:
        "200":
          description: Installed stone categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InstalledStoneCategory"
    post:
      operationId: createAdminInstalledStoneCategory
      tags: [admin]
      summary: Create an installed stone category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstalledStoneCategoryInput"
      responses:
        "201":
          description: Created installed stone category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstalledStoneCategory"
  /admin/installed-stone-categories/{id}:
    parameters:
      - $ref: "#/components/parameters/RecordId"
    put:
      operationId: updateAdminInstalledStoneCategory
      tags: [admin]
      summary: Update or archive an installed stone category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstalledStoneCategoryInput"
      responses:
        "200":
          description: Updated installed stone category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstalledStoneCategory"
    delete:
      operationId: deleteAdminInstalledStoneCategory
      tags: [admin]
      summary: Archive an installed stone category
      responses:
        "204":
          description: Archived
  /admin/installed-stones/{id}:
    parameters:
      - $ref: "#/components/parameters/RecordId"
    put:
      operationId: updateAdminInstalledStone
      tags: [admin]
      summary: Update an installed stone price
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstalledStonePriceInput"
      responses:
        "200":
          description: Updated installed stone price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstalledStonePrice"
    delete:
      operationId: deleteAdminInstalledStone
      tags: [admin]
      summary: Delete an installed stone price
      responses:
        "204":
          description: Deleted
  /admin/sheet-stones:
    get:
      operationId: listAdminSheetStones
      tags: [admin]
      summary: List all whole-sheet stone prices
      responses:
        "200":
          description: Whole-sheet stone prices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SheetStonePrice"
    post:
      operationId: createAdminSheetStone
      tags: [admin]
      summary: Create a whole-sheet stone price
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SheetStonePriceInput"
      responses:
        "201":
          description: Created whole-sheet stone price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetStonePrice"
  /admin/sheet-stones/{id}:
    parameters:
      - $ref: "#/components/parameters/RecordId"
    put:
      operationId: updateAdminSheetStone
      tags: [admin]
      summary: Update a whole-sheet stone price
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SheetStonePriceInput"
      responses:
        "200":
          description: Updated whole-sheet stone price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetStonePrice"
    delete:
      operationId: deleteAdminSheetStone
      tags: [admin]
      summary: Delete a whole-sheet stone price
      responses:
        "204":
          description: Deleted
  /support/chat:
    post:
      operationId: sendSupportChatMessage
      tags: [support]
      summary: Ask KnightSupport about catalog products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportChatInput"
      responses:
        "200":
          description: Product support answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportChatResponse"
  /leads:
    post:
      operationId: upsertLead
      tags: [leads]
      summary: Create or update a storefront lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "200":
          description: Lead saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerLead"
  /leads/sketch:
    post:
      operationId: submitSketchLead
      tags: [leads]
      summary: Save a hand-sketch lead with its uploaded image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, metadata]
              properties:
                file: { type: string, description: Uploaded image file supplied as multipart content }
                metadata: { type: string, description: JSON-encoded LeadInput metadata }
      responses:
        "201":
          description: Sketch lead saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SketchLeadResponse"
  /admin/leads:
    get:
      operationId: listAdminLeads
      tags: [admin]
      summary: List storefront leads
      responses:
        "200":
          description: Storefront leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerLead"
  /admin/leads/{id}:
    parameters:
      - $ref: "#/components/parameters/RecordId"
    patch:
      operationId: updateAdminLead
      tags: [admin]
      summary: Update a lead status and notes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLeadUpdateInput"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerLead"
  /auth/line/status:
    get:
      operationId: getLineAuthStatus
      tags: [customer-auth]
      summary: Get current LINE customer identity status
      responses:
        "200":
          description: LINE identity status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineAuthStatus"
  /auth/line/session:
    delete:
      operationId: deleteLineSession
      tags: [customer-auth]
      summary: Log out the current LINE customer
      responses:
        "204":
          description: Logged out
components:
  parameters:
    RecordId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    HealthStatus:
      type: object
      required: [status, lineLogin]
      properties:
        status:
          type: string
        lineLogin:
          type: object
          required:
            - ready
            - channelConfigured
            - secretConfigured
            - callbackUrlConfigured
            - callbackUrlValid
            - callbackEnvironment
            - callbackReason
          properties:
            ready: { type: boolean }
            channelConfigured: { type: boolean }
            secretConfigured: { type: boolean }
            callbackUrlConfigured: { type: boolean }
            callbackUrlValid: { type: boolean }
            callbackEnvironment:
              type: string
              enum: [production, development, invalid, missing]
            callbackReason:
              type: string
              enum: [configured, missing, malformed, not_https, unexpected_host, unexpected_path, unexpected_format]
    AdminSession:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
    BasinPriceInput:
      type: object
      required: [sku, colorCode, colorName, priceTHB, category, dimensions, imageTone, active, sortOrder]
      properties:
        sku: { type: string, minLength: 1, maxLength: 32 }
        colorCode: { type: string, minLength: 1, maxLength: 64 }
        colorName: { type: string, minLength: 1, maxLength: 160 }
        priceTHB: { type: integer, minimum: 0 }
        category:
          type: string
          minLength: 1
          maxLength: 120
        categoryId:
          type: [integer, "null"]
          minimum: 1
        dimensions: { type: string, minLength: 1, maxLength: 160 }
        basinDimensions:
          type: [string, "null"]
          maxLength: 160
        bowlMm:
          type: [string, "null"]
          maxLength: 160
        imageTone: { type: string, minLength: 1, maxLength: 24 }
        imageUrl: { type: [string, "null"], maxLength: 2000 }
        videoUrl: { type: [string, "null"], maxLength: 2000 }
        active: { type: boolean }
        sortOrder: { type: integer }
    BasinPrice:
      allOf:
        - $ref: "#/components/schemas/BasinPriceInput"
        - $ref: "#/components/schemas/RecordMetadata"
        - type: object
          required: [imageUrl, videoUrl, uploadedVideoUrl]
          properties:
            imageUrl: { type: string }
            videoUrl: { type: string }
            uploadedVideoUrl: { type: [string, "null"] }
            categoryId: { type: [integer, "null"] }
    BasinCategoryInput:
      type: object
      required: [name, active, sortOrder]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        active: { type: boolean }
        sortOrder: { type: integer }
    BasinCategory:
      allOf:
        - $ref: "#/components/schemas/BasinCategoryInput"
        - $ref: "#/components/schemas/RecordMetadata"
    UploadedMedia:
      type: object
      required: [filename, contentType, size, originalName, version, url]
      properties:
        filename: { type: string }
        contentType: { type: string }
        size: { type: integer }
        originalName: { type: string }
        version: { type: string }
        url: { type: string }
    InstalledStonePriceInput:
      type: object
      required: [code, name, pricePerSqmTHB, categoryId, tone, aliases, active, sortOrder]
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 160 }
        pricePerSqmTHB: { type: integer, minimum: 0 }
        categoryId: { type: [integer, "null"], minimum: 1 }
        tone: { type: string, minLength: 1, maxLength: 24 }
        imageUrl: { type: [string, "null"], maxLength: 2000 }
        aliases:
          type: array
          items: { type: string }
        active: { type: boolean }
        sortOrder: { type: integer }
    InstalledStonePrice:
      allOf:
        - $ref: "#/components/schemas/InstalledStonePriceInput"
        - $ref: "#/components/schemas/RecordMetadata"
        - type: object
          required: [imageUrl]
          properties:
            imageUrl: { type: string }
    InstalledStoneCategoryInput:
      type: object
      required: [name, active, sortOrder]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        active: { type: boolean }
        sortOrder: { type: integer }
    InstalledStoneCategory:
      allOf:
        - $ref: "#/components/schemas/InstalledStoneCategoryInput"
        - $ref: "#/components/schemas/RecordMetadata"
    SheetStonePriceInput:
      type: object
      required: [code, name, basePriceTHB, price10PlusTHB, price50PlusTHB, tone, aliases, active, sortOrder]
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 160 }
        basePriceTHB: { type: integer, minimum: 0 }
        price10PlusTHB: { type: integer, minimum: 0 }
        price50PlusTHB: { type: integer, minimum: 0 }
        tone: { type: string, minLength: 1, maxLength: 24 }
        imageUrl: { type: [string, "null"], maxLength: 2000 }
        aliases:
          type: array
          items: { type: string }
        active: { type: boolean }
        sortOrder: { type: integer }
    SheetStonePrice:
      allOf:
        - $ref: "#/components/schemas/SheetStonePriceInput"
        - $ref: "#/components/schemas/RecordMetadata"
        - type: object
          required: [imageUrl]
          properties:
            imageUrl: { type: string }
    RecordMetadata:
      type: object
      required: [id, createdAt, updatedAt]
      properties:
        id: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Catalog:
      type: object
      required: [basins, categories, installedStones, sheetStones]
      properties:
        basins:
          type: array
          items:
            $ref: "#/components/schemas/BasinPrice"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/BasinCategory"
        installedStones:
          type: array
          items:
            $ref: "#/components/schemas/InstalledStonePrice"
        sheetStones:
          type: array
          items:
            $ref: "#/components/schemas/SheetStonePrice"
    SupportChatInput:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 500 }
    SupportChatResponse:
      type: object
      required: [reply, matchedType]
      properties:
        reply: { type: string }
        matchedType:
          type: string
          enum: [basin, stone, none]
        matchedCode:
          type: [string, "null"]
        compareItems:
          type: array
          items:
            $ref: "#/components/schemas/SupportCatalogItem"
    SupportCatalogItem:
      type: object
      required: [code, name, category, priceTHB, dimensions]
      properties:
        code: { type: string }
        name: { type: string }
        category: { type: string }
        priceTHB: { type: integer }
        dimensions: { type: string }
        basinDimensions:
          type: [string, "null"]
    LeadInput:
      type: object
      required: [leadKey, status, source, productSkus]
      properties:
        leadKey: { type: string, minLength: 12, maxLength: 120 }
        status:
          type: string
          enum: [new_lead, selecting, quote_requested, closed]
        source: { type: string, maxLength: 64 }
        name: { type: [string, "null"], maxLength: 160 }
        company: { type: [string, "null"], maxLength: 200 }
        phone: { type: [string, "null"], maxLength: 64 }
        email: { type: [string, "null"], maxLength: 240 }
        project: { type: [string, "null"], maxLength: 240 }
        address: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        productSkus:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 32 }
        quoteNumber: { type: [string, "null"], maxLength: 64 }
        orderMode:
          type: string
          enum: [quick-purchase, studio, sketch]
        studioData:
          type: [object, "null"]
          additionalProperties: true
        sketchUrl: { type: [string, "null"], maxLength: 2000 }
    AdminLeadUpdateInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [new_lead, selecting, quote_requested, closed]
        notes: { type: [string, "null"] }
    CustomerLead:
      type: object
      required: [id, leadKey, status, source, productSkus, createdAt, updatedAt]
      properties:
        id: { type: integer }
        leadKey: { type: string }
        status:
          type: string
          enum: [new_lead, selecting, quote_requested, closed]
        source: { type: string }
        name: { type: [string, "null"] }
        company: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        email: { type: [string, "null"] }
        project: { type: [string, "null"] }
        address: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        productSkus:
          type: array
          items: { type: string }
        quoteNumber: { type: [string, "null"] }
        orderMode:
          type: string
          enum: [quick-purchase, studio, sketch]
        studioData:
          type: [object, "null"]
          additionalProperties: true
        sketchUrl: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SketchLeadResponse:
      type: object
      required: [lead, notificationStatus]
      properties:
        lead:
          $ref: "#/components/schemas/CustomerLead"
        notificationStatus:
          type: string
          enum: [notified, saved_not_notified]
    LineAuthUser:
      type: object
      required: [userId, displayName]
      properties:
        userId: { type: string }
        displayName: { type: string }
        pictureUrl:
          type: [string, "null"]
    LineAuthStatus:
      type: object
      required: [configured, authenticated, user]
      properties:
        configured: { type: boolean }
        authenticated: { type: boolean }
        user:
          oneOf:
            - $ref: "#/components/schemas/LineAuthUser"
            - type: "null"


        condoFloor: { type: [string, "null"], maxLength: 32 }
        expectedInstallationDate: { type: [string, "null"], format: date }
        productSkus:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 32 }
        quoteNumber: { type: [string, "null"], maxLength: 64 }
        orderMode:
          type: string
          enum: [quick-purchase, studio, sketch]
        studioData:
          type: [object, "null"]
          additionalProperties: true
        sketchUrl: { type: [string, "null"], maxLength: 2000 }
    AdminLeadUpdateInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [new_lead, selecting, quote_requested, closed]
        notes: { type: [string, "null"] }
        staffDimensions:
          type: [object, "null"]
          properties:
            widthMm: { type: [number, "null"] }
            lengthMm: { type: [number, "null"] }
            depthMm: { type: [number, "null"] }
    AdminLeadStatusUpdateInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum:
            - new_lead
            - selecting
            - quote_requested
            - quote_sent
            - waiting_deposit
            - team_reported_paid
            - deposit_paid
            - ready_for_production
            - closed
    AdminLeadTechnicianUpdateInput:
      type: object
      description: At least one of technicianTeamCode or expectedInstallationDate must be present; an omitted field is left untouched
      properties:
        technicianTeamCode:
          type: [string, "null"]
          pattern: "^[A-Z]{2,8}$"
          description: A code from GET /admin/technician-teams (active or inactive), or null to clear the assignment back to unassigned
        expectedInstallationDate:
          type: [string, "null"]
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          description: "Installation date as YYYY-MM-DD (Asia/Bangkok), or null to clear it"
    CustomerLead:
      type: object
      required: [id, leadKey, status, source, productSkus, createdAt, updatedAt]
      properties:
        id: { type: integer }
        leadKey: { type: string }
        status:
          type: string
          enum: [new_lead, selecting, quote_requested, closed]
        source: { type: string }
        name: { type: [string, "null"] }
        company: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        lineContact: { type: [string, "null"] }
        email: { type: [string, "null"] }
        project: { type: [string, "null"] }
        address: { type: [string, "null"] }
        site: { type: [string, "null"] }
        purchasingDepartment: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        taxName: { type: [string, "null"] }
        taxId: { type: [string, "null"] }
        taxBranch: { type: [string, "null"] }
        taxAddress: { type: [string, "null"] }
        preferredContact: { type: [string, "null"] }
        customerRole: { type: [string, "null"] }
        propertyType: { type: [string, "null"] }
        condoFloor: { type: [string, "null"] }
        expectedInstallationDate: { type: [string, "null"], format: date }
        technicianTeamCode:
          type: [string, "null"]
          pattern: "^[A-Z]{2,8}$"
          description: A code from GET /admin/technician-teams (active or inactive), or null if unassigned
        productSkus:
          type: array
          items: { type: string }
        quoteNumber: { type: [string, "null"] }
        publicQuoteToken: { type: [string, "null"] }
        orderMode:
          type: string
          enum: [quick-purchase, studio, sketch]
        studioData:
          type: [object, "null"]
          additionalProperties: true
        sketchUrl: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    NotifyQuoteInput:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 32, maxLength: 512 }
    QuoteNotificationResponse:
      type: object
      required: [notificationStatus, message]
      properties:
        notificationStatus:
          type: string
          enum: [notified, saved_not_notified]
        message: { type: string }
    SketchLeadResponse:
      type: object
      required: [lead, notificationStatus]
      properties:
        lead:
          $ref: "#/components/schemas/CustomerLead"
        notificationStatus:
          type: string
          enum: [notified, saved_not_notified]
        message: { type: string }
    PaymentSlip:
      type: object
      required: [id, leadId, kind, status, sourceType, slipImageUrl, reviewedByAdmin, createdAt, updatedAt]
      properties:
        id: { type: integer }
        leadId: { type: [integer, "null"] }
        kind:
          type: string
          enum: [deposit, final]
        status:
          type: string
          enum: [pending, verified, needs_review, rejected, team_reported_paid, voided]
        sourceType:
          type: string
          enum: [direct_upload, line_group_archive]
        referenceValue: { type: [string, "null"] }
        archiveMessageId: { type: [string, "null"] }
        archiveAttachmentId: { type: [string, "null"] }
        sourceHash: { type: [string, "null"] }
        slipImageUrl: { type: string }
        claimedAmountThb: { type: [integer, "null"] }
        verifiedAmountThb: { type: [integer, "null"] }
        senderName: { type: [string, "null"] }
        transRef: { type: [string, "null"] }
        slipokErrorCode: { type: [string, "null"] }
        reviewedByAdmin: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminDashboardStats:
      type: object
      required:
        - period
        - kpis
        - actionItems
        - pipelineRatio
        - upcomingInstallations
        - popularItems
        - popularStones
        - popularBasins
        - recentActivities
        - monthlyComparison
        - projectedCashInflowThb
        - technicianCapacity
        - asOf
      properties:
        period:
          type: string
          enum: [all, "7d", "30d", "3m", year]
        kpis: { $ref: "#/components/schemas/AdminDashboardKpis" }
        actionItems: { $ref: "#/components/schemas/AdminDashboardActionItems" }
        pipelineRatio: { $ref: "#/components/schemas/AdminDashboardPipelineRatio" }
        upcomingInstallations:
          type: array
          items:
            $ref: "#/components/schemas/AdminDashboardInstallation"
        popularItems:
          type: array
          items:
            $ref: "#/components/schemas/AdminDashboardPopularItem"
        popularStones:
          type: array
          description: Popular items restricted to non-basin (stone) SKUs -- those not starting with "KF"
          items:
            $ref: "#/components/schemas/AdminDashboardPopularItem"
        popularBasins:
          type: array
          description: Popular items restricted to basin SKUs (starting with "KF")
          items:
            $ref: "#/components/schemas/AdminDashboardPopularItem"
        recentActivities:
          type: array
          items:
            $ref: "#/components/schemas/AdminDashboardActivity"
        monthlyComparison:
          type: array
          description: Revenue and lead count for the trailing 3 calendar months (Buddhist year, Asia/Bangkok), independent of the period filter
          items:
            $ref: "#/components/schemas/AdminDashboardMonthlyComparison"
        projectedCashInflowThb:
          type: integer
          description: Forecasted cash not yet collected for leads installing within the next 14 days (quote total minus amounts already paid)
        technicianCapacity:
          type: array
          description: Radar of all 10 install teams' load over the next 7 days
          items:
            $ref: "#/components/schemas/AdminDashboardTechnicianCapacity"
        asOf: { type: string, format: date-time }
    AdminDashboardKpis:
      type: object
      required: [totalRevenueThb, totalLeads, readyForProduction, closed]
      properties:
        totalRevenueThb: { type: integer, description: Sum of verified + team_reported_paid slip amounts; excludes voided }
        totalLeads: { type: integer }
        readyForProduction: { type: integer }
        closed: { type: integer }
    AdminDashboardActionItems:
      type: object
      required: [unassignedSlipsCount, awaitingContactCount]
      properties:
        unassignedSlipsCount: { type: integer }
        awaitingContactCount: { type: integer }
    AdminDashboardPipelineRatio:
      type: object
      required: [usCount, ofCount, otherCount]
      properties:
        usCount: { type: integer }
        ofCount: { type: integer }
        otherCount: { type: integer }
    AdminDashboardInstallation:
      type: object
      required: [id, leadKey, name, quoteNumber, project, address, expectedInstallationDate, notes]
      properties:
        id: { type: integer }
        leadKey: { type: string }
        name: { type: string }
        quoteNumber: { type: [string, "null"] }
        project: { type: [string, "null"] }
        address: { type: [string, "null"] }
        expectedInstallationDate: { type: string, description: "ISO date (YYYY-MM-DD)" }
        notes: { type: [string, "null"] }
    AdminDashboardPopularItem:
      type: object
      required: [sku, count]
      properties:
        sku: { type: string }
        count: { type: integer }
    AdminDashboardActivity:
      type: object
      required: [id, type, title, detail, timestamp]
      properties:
        id: { type: string }
        type:
          type: string
          enum: [lead_created, payment_received]
        title: { type: string }
        detail: { type: string }
        timestamp: { type: string, format: date-time }
    AdminDashboardMonthlyComparison:
      type: object
      required: [monthLabel, revenueThb, leadCount]
      properties:
        monthLabel: { type: string, description: "e.g. \"ก.ค. 69\" (Thai abbreviated month + 2-digit Buddhist year)" }
        revenueThb: { type: integer }
        leadCount: { type: integer }
    AdminDashboardTechnicianJob:
      type: object
      required: [id, leadKey, name, project, date, confidence]
      properties:
        id: { type: integer }
        leadKey: { type: string }
        name: { type: string }
        project: { type: [string, "null"] }
        date: { type: string, description: "ISO date (YYYY-MM-DD)" }
        confidence:
          type: string
          enum: [exact, prefix, fuzzy, manual]
          description: "How the team assignment was resolved: manual is explicit technicianTeamCode; exact/prefix/fuzzy come from free-text matching."
    AdminDashboardTechnicianCapacity:
      type: object
      required: [teamCode, teamName, activeJobsCount, status, jobs]
      properties:
        teamCode:
          type: string
          enum: [TP, PP, ST, CM, KF, PA, PM, TJ, AM, CL]
        teamName: { type: string }
        activeJobsCount: { type: integer }
        status:
          type: string
          enum: [busy, moderate, available]
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/AdminDashboardTechnicianJob"
    TechnicianCalendarJob:
      type: object
      required: [id, leadKey, name, project, address, quoteNumber, confidence]
      properties:
        id: { type: integer }
        leadKey: { type: string }
        name: { type: string }
        project: { type: [string, "null"] }
        address: { type: [string, "null"] }
        quoteNumber: { type: [string, "null"] }
        confidence:
          type: string
          enum: [exact, prefix, fuzzy, manual]
          description: "How the team assignment was resolved: manual is explicit technicianTeamCode; exact/prefix/fuzzy come from free-text matching."
    TechnicianCalendarTeamDay:
      type: object
      required: [teamCode, teamName, status, jobCount, jobs]
      properties:
        teamCode:
          type: string
          enum: [TP, PP, ST, CM, KF, PA, PM, TJ, AM, CL]
        teamName: { type: string }
        status:
          type: string
          enum: [available, moderate, busy]
          description: "Team status that day: available (0 jobs), moderate (1-2), busy (3+)"
        jobCount: { type: integer }
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/TechnicianCalendarJob"
    TechnicianCalendarDay:
      type: object
      required: [date, dayStatus, totalJobs, teams]
      properties:
        date: { type: string, description: "ISO date (YYYY-MM-DD)" }
        dayStatus:
          type: string
          enum: [available, moderate, busy]
          description: "Day status across all teams: available (0 total jobs), busy (>=4 total jobs, or any single team busy), otherwise moderate"
        totalJobs: { type: integer, description: Count of leads installing this day, regardless of team assignment }
        teams:
          type: array
          description: All 10 teams, every day, even when a team has zero jobs that day
          items:
            $ref: "#/components/schemas/TechnicianCalendarTeamDay"
    TechnicianCalendarResponse:
      type: object
      required: [month, days, technicianTeams]
      properties:
        month: { type: string, description: "YYYY-MM, echoed back from the request" }
        days:
          type: array
          items:
            $ref: "#/components/schemas/TechnicianCalendarDay"
        technicianTeams:
          type: array
          description: Dictionary of all 10 teams (code + display name)
          items:
            type: object
            required: [teamCode, teamName]
            properties:
              teamCode:
                type: string
                enum: [TP, PP, ST, CM, KF, PA, PM, TJ, AM, CL]
              teamName: { type: string }
    PaymentSlipIntakeInput:
      type: object
      required: [file, archiveAttachmentId, sourceHash]
      properties:
        file: { type: string, description: Uploaded slip image supplied as multipart content }
        referenceValue:
          type: [string, "null"]
          maxLength: 64
          description: Optional LINE job code such as 26/1070 or JB26/1064
        archiveMessageId: { type: [string, "null"], maxLength: 128 }
        archiveAttachmentId: { type: string, minLength: 1, maxLength: 128 }
        sourceHash:
          type: string
          pattern: "^[a-fA-F0-9]{64}$"
        claimedAmountThb: { type: [integer, "null"], minimum: 0 }
        senderName: { type: [string, "null"], maxLength: 200 }
        kind:
          type: string
          enum: [deposit, final]
    PaymentSlipAssignInput:
      type: object
      required: [leadId]
      properties:
        leadId: { type: integer, minimum: 1 }
    LineAuthUser:
      type: object
      required: [userId, displayName]
      properties:
        userId: { type: string }
        displayName: { type: string }
        pictureUrl:
          type: [string, "null"]
    LineAuthStatus:
      type: object
      required: [configured, authenticated, user]
      properties:
        configured: { type: boolean }
        authenticated: { type: boolean }
        user:
          oneOf:
            - $ref: "#/components/schemas/LineAuthUser"
            - type: "null"
    CustomerProfileInput:
      type: object
      required: [fullName, phone, email, company, project, address, taxName, taxId, taxBranch, taxAddress, preferredContact, customerRole]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 160 }
        phone: { type: string, pattern: "^[0-9]{10}$" }
        email: { type: string, maxLength: 240 }
        company: { type: string, maxLength: 200 }
        project: { type: string, maxLength: 240 }
        address: { type: string, maxLength: 4000 }
        taxName: { type: string, maxLength: 240 }
        taxId: { type: string, pattern: "^$|^[0-9]{13}$" }
        taxBranch: { type: string, maxLength: 120 }
        taxAddress: { type: string, maxLength: 4000 }
        lineContact: { type: string, maxLength: 120 }
        preferredContact:
          type: string
          enum: [line, phone, email]
        customerRole:
          type: string
          enum: [homeowner, architect-interior, contractor]
        propertyType:
          type: string
          enum: [house-townhome, condo, commercial]
        condoFloor: { type: string, maxLength: 32 }
        expectedInstallationDate: { type: [string, "null"], format: date }
    CustomerProfile:
      allOf:
        - $ref: "#/components/schemas/CustomerProfileInput"
        - type: object
          required: [id, lineUserId, displayName, pictureUrl, createdAt, updatedAt]
          properties:
            id: { type: integer }
            lineUserId: { type: string }
            displayName: { type: string }
            pictureUrl: { type: [string, "null"] }
            taxName: { type: string }
            taxId: { type: string }
            taxBranch: { type: string }
            taxAddress: { type: string }
            lineContact: { type: string }
            preferredContact: { type: string }
            customerRole: { type: string }
            propertyType: { type: string }
            condoFloor: { type: string }
            expectedInstallationDate: { type: [string, "null"], format: date }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    CustomerQuotation:
      type: object
      required: [id, quoteNumber, orderMode, issuedAt, updatedAt, viewUrl]
      properties:
        id: { type: integer }
        quoteNumber: { type: string }
        orderMode:
          type: string
          enum: [studio, quick-purchase]
        issuedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        amountTHB: { type: [integer, "null"] }
        viewUrl: { type: string }
    WorksiteAddressSuggestions:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/WorksiteAddressSuggestion"
    WorksiteAddressSuggestion:
      type: object
      required: [placeId, text, primaryText, secondaryText]
      properties:
        placeId: { type: string, minLength: 1, maxLength: 512 }
        text: { type: string, minLength: 1, maxLength: 1000 }
        primaryText: { type: string, minLength: 1, maxLength: 500 }
        secondaryText: { type: string, maxLength: 500 }
    TechnicianTeam:
      type: object
      required: [id, code, name, shortName, aliases, sortOrder, active]
      properties:
        id: { type: integer }
        code: { type: string, pattern: "^[A-Z]{2,8}$" }
        name: { type: string, maxLength: 80 }
        shortName: { type: string, maxLength: 40 }
        aliases:
          type: array
          items: { type: string }
          description: Extra spellings seen in the LINE group, stored WITHOUT a leading ทีม/ช่าง (the matcher adds those itself)
        sortOrder: { type: integer }
        active:
          type: boolean
          description: Inactive teams stay resolvable for old jobs but are not offered in the dispatch dropdown
    TechnicianTeamCreateInput:
      type: object
      required: [code, name, shortName]
      properties:
        code: { type: string, pattern: "^[A-Z]{2,8}$" }
        name: { type: string, minLength: 1, maxLength: 80 }
        shortName: { type: string, minLength: 1, maxLength: 40 }
        aliases:
          type: array
          items: { type: string }
        sortOrder: { type: integer }
    TechnicianTeamUpdateInput:
      type: object
      description: At least one field must be present; code cannot be changed
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        shortName: { type: string, minLength: 1, maxLength: 40 }
        aliases:
          type: array
          items: { type: string }
        sortOrder: { type: integer }
        active: { type: boolean }

kind = "web"
previewPath = "/"
title = "Knight Basins Storefront"
description = "A Thai-first Knight Furnich storefront prototype for browsing catalog basins, configuring synthetic stone purchases, building quotations, and printing a customer-ready quote."
version = "1.0.0"
id = "artifacts/knight-basins"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22731

[services.development]
run = "pnpm --filter @workspace/knight-basins run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/knight-basins", "run", "build" ]
serve = "static"
publicDir = "artifacts/knight-basins/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22731"
BASE_PATH = "/"

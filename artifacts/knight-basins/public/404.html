<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>ไม่พบหน้านี้ | Knight Furnich</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: "Noto Sans Thai", "Sarabun", system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f6f5f2; color: #1c1b19; padding: 24px;
      }
      main { max-width: 560px; text-align: center; }
      .code { font-size: 64px; font-weight: 700; letter-spacing: 0.04em; color: #8a7f6d; margin: 0; }
      h1 { font-size: 22px; margin: 8px 0 12px; }
      p { line-height: 1.7; color: #4a4741; margin: 0 0 24px; }
      ul { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
      a {
        display: inline-block; padding: 10px 16px; border-radius: 999px;
        background: #1c1b19; color: #fff; text-decoration: none; font-size: 14px;
      }
      a.secondary { background: #fff; color: #1c1b19; border: 1px solid #d8d3c9; }
      @media (prefers-color-scheme: dark) {
        body { background: #17161a; color: #f2efe9; }
        p { color: #c9c3b8; }
        a { background: #f2efe9; color: #17161a; }
        a.secondary { background: transparent; color: #f2efe9; border-color: #45414a; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>ไม่พบหน้านี้</h1>
      <p>
        ลิงก์นี้อาจถูกย้ายหรือพิมพ์ไม่ครบ — เลือกดูหน้าที่มีอยู่ได้จากปุ่มด้านล่างครับ
      </p>
      <ul>
        <li><a href="/">หน้าแรก</a></li>
        <li><a class="secondary" href="/stone">หินสังเคราะห์ &amp; เคาน์เตอร์</a></li>
        <li><a class="secondary" href="/quote">ขอใบเสนอราคา</a></li>
        <li><a class="secondary" href="/portfolio">ภาพผลงานจริง</a></li>
      </ul>
    </main>
  </body>
</html>

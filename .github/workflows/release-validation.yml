name: Release validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release contents
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4

      - name: Block tracked runtime uploads
        run: bash deploy/hostinger/check-upload-files.sh

      - name: Test the upload release guard
        run: bash deploy/hostinger/check-upload-files.test.sh

  unit-tests:
    name: Unit tests (api-server and knight-basins)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4

      # pnpm 10 or newer: this repo keeps its pnpm `overrides` in pnpm-workspace.yaml, and pnpm 9
      # reports that as a lockfile mismatch (ERR_PNPM_LOCKFILE_CONFIG_MISMATCH) under --frozen-lockfile.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # node --experimental-strip-types (used by every package's `test` script) needs Node 22.6 or newer.
          node-version: 24
          cache: pnpm

      # --frozen-lockfile: fail on lockfile drift instead of silently rewriting it.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and typecheck shared libs
        run: pnpm run typecheck:libs

      - name: Typecheck api-server
        working-directory: artifacts/api-server
        run: pnpm exec tsc --noEmit

      - name: Typecheck knight-basins
        working-directory: artifacts/knight-basins
        run: pnpm exec tsc --noEmit

      # Deploy parity: run the exact web build the deploy workflow runs. Without this gate a build that only
      # breaks in the deploy environment (Node version, missing script deps) shows up as "CI green / deploy red".
      - name: Build Web App (deploy parity)
        working-directory: artifacts/knight-basins
        env:
          PORT: "3000"
          NODE_ENV: "production"
        run: pnpm run build

      # The *.browser.test.ts files drive a real browser against a dev server and are left out here.
      - name: Test api-server
        working-directory: artifacts/api-server
        run: |
          files=$(find test -maxdepth 1 -name '*.test.ts' ! -name '*.browser.test.ts' | sort)
          node --experimental-strip-types --test $files

      - name: Test knight-basins
        working-directory: artifacts/knight-basins
        run: |
          files=$(find test -maxdepth 1 -name '*.test.ts' ! -name '*.browser.test.ts' | sort)
          node --experimental-strip-types --test $files

  contrast-sweep:
    name: Contrast sweep (${{ matrix.width }}px, round ${{ matrix.round }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        width: [1440, 390]
        round: [1, 2]
    env:
      PORT: "5173"
      BASE_PATH: "/"
      CHROME_BIN: "/usr/bin/google-chrome"
      SCAN_WIDTH: "${{ matrix.width }}"
    steps:
      - uses: actions/checkout@v4
      - name: Require runner Chrome
        run: |
          test -x "$CHROME_BIN" || { echo "::error::Chrome unavailable — contrast was NOT checked"; exit 2; }
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:libs
      - name: Build storefront
        run: pnpm --filter @workspace/knight-basins run build
      - name: Serve built app and public read-only catalogue
        run: |
          node qa/tools/mock-api-466c.mjs > /tmp/contrast-api.log 2>&1 &
          pnpm --filter @workspace/knight-basins run serve > /tmp/contrast-web.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent --connect-timeout 2 --max-time 3 http://127.0.0.1:5173/ > /dev/null && curl --fail --silent --connect-timeout 2 --max-time 3 http://127.0.0.1:5173/api/catalog > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/contrast-api.log /tmp/contrast-web.log
          echo "::error::ยังไม่ได้ตรวจ (หน้าโหลดไม่จบ: /) — Preview/catalogue unavailable"
          exit 2
      - name: Sweep 12 sitemap routes and non-sitemap routes in both themes
        run: |
          node qa/tools/test-gradient-occlusion.mjs
          node qa/tools/sweep-467c.mjs http://127.0.0.1:5173 --sitemap http://127.0.0.1:5173/sitemap.xml --out qa/images/replit-round32/ci-${{ matrix.width }}-round${{ matrix.round }}
      - name: A4 quote regression on Linux (existing browser case)
        if: always() && matrix.width == 1440 && matrix.round == 1
        env:
          BROWSER_TEST_BASE_URL: "http://127.0.0.1:5173"
          CHROMIUM_BIN: "/usr/bin/google-chrome"
        run: |
          sudo apt-get update -qq && sudo apt-get install -y poppler-utils
          set -o pipefail
          mkdir -p qa/images/replit-round32/ci-1440-round1
          node --experimental-strip-types --test --test-concurrency=1 --test-name-pattern="keeps every basin and stone row readable on mobile and across print pages" artifacts/knight-basins/test/quote-print-fixture.browser.test.ts 2>&1 | tee qa/images/replit-round32/ci-1440-round1/a4-proof.log
      - name: Retain raw contrast evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contrast-${{ matrix.width }}-round${{ matrix.round }}
          path: |
            qa/images/replit-round32/ci-${{ matrix.width }}-round${{ matrix.round }}
            /tmp/contrast-api.log
            /tmp/contrast-web.log

  contrast-determinism:
    name: Compare both contrast rounds
    needs: contrast-sweep
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: contrast-*-round*
          path: /tmp/contrast-rounds
      - name: Require identical counts, coverage and verdicts
        run: node qa/tools/sweep-467c.mjs --compare-rounds /tmp/contrast-rounds

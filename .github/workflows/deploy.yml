name: Deploy to Hostinger VPS

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Web App
        run: |
          cd artifacts/knight-basins
          npm ci || npm install
          PORT=3000 NODE_ENV=production ./node_modules/.bin/vite build --mode production

      - name: Build API Server
        run: |
          cd artifacts/api-server
          npm ci || npm install
          node ./build.mjs

      - name: Copy Web Dist to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 72.62.79.84
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "artifacts/knight-basins/dist/public/*"
          target: "/docker/knightbasins/web-dist/"
          strip_prefix: "artifacts/knight-basins/dist/public/"

      - name: Copy API Dist to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 72.62.79.84
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "artifacts/api-server/dist/*"
          target: "/docker/knightbasins/api-dist/"
          strip_prefix: "artifacts/api-server/dist/"

      - name: Restart Docker Containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 72.62.79.84
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            chmod -R 755 /docker/knightbasins/web-dist /docker/knightbasins/api-dist
            docker restart knightbasins-api knightbasins-web

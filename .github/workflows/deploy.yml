name: Deploy to Hostinger VPS

# Disabled per owner instruction (automated deploy via David's internal tooling).
# To re-enable, restore the 'push' trigger below.
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web App
        env:
          PORT: "3000"
          NODE_ENV: "production"
        run: |
          cd artifacts/knight-basins
          PORT=3000 NODE_ENV=production pnpm run build

      - name: Build API Server
        env:
          PORT: "5000"
          NODE_ENV: "production"
        run: |
          cd artifacts/api-server
          PORT=5000 NODE_ENV=production pnpm run build || node ./build.mjs

      - name: Copy Web Dist to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 72.62.79.84
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "artifacts/knight-basins/dist/public/*"
          target: "/docker/knightbasins/web-dist/"
          strip_components: 4

      - name: Copy API Dist to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 72.62.79.84
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "artifacts/api-server/dist/*"
          target: "/docker/knightbasins/api-dist/"
          strip_components: 3

      - name: Restart Docker Containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 72.62.79.84
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            chmod -R 755 /docker/knightbasins/web-dist /docker/knightbasins/api-dist
            docker restart knightbasins-api knightbasins-web

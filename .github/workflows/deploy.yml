name: Deploy to Hostinger VPS

on:
  push:
    branches: [ main ]

# One deploy at a time. Two pushes to main in quick succession used to run side by side (job-225): both copy into
# the same /docker/knightbasins directories, both run migrate.sh and both restart the containers, so the older
# run could finish last and put the older build back. A later push now waits for the running deploy; a run that
# is already waiting is replaced by the newer one, which is fine because every deploy builds the whole of main.
# cancel-in-progress stays false so a deploy that has started is never cut off in the middle of a copy or a migration.
concurrency:
  group: deploy-hostinger-vps
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Migrations now run on every deploy, so they must stay additive. Fail here - before anything is built,
      # copied or applied - if a migration file contains DROP or TRUNCATE (comments are ignored). A change that
      # really has to remove something is applied by hand, not by a push to main.
      - name: Check that migrations are additive
        run: |
          set -euo pipefail
          shopt -s nullglob
          failed=0
          for file in deploy/hostinger/migrations/*.sql; do
            # no `grep -q`: with pipefail it can end the pipe early and turn a match into a SIGPIPE failure
            if sed -E 's/--.*$//' "$file" | grep -iE '\b(drop|truncate)\b' > /dev/null; then
              echo "::error file=${file}::migrations must be additive (found DROP or TRUNCATE) - apply destructive changes by hand"
              failed=1
            fi
          done
          exit "$failed"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web App
        env:
          PORT: "3000"
          NODE_ENV: "production"
        run: |
          cd artifacts/knight-basins
          PORT=3000 NODE_ENV=production pnpm run build

      - name: Build API Server
        env:
          PORT: "5000"
          NODE_ENV: "production"
        run: |
          cd artifacts/api-server
          PORT=5000 NODE_ENV=production pnpm run build || node ./build.mjs

      - name: Copy Web Dist to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 72.62.79.84
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "artifacts/knight-basins/dist/public/*"
          target: "/docker/knightbasins/web-dist/"
          strip_components: 4

      - name: Copy API Dist to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 72.62.79.84
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "artifacts/api-server/dist/*"
          target: "/docker/knightbasins/api-dist/"
          strip_components: 3

      # Only the migration files travel to the VPS (the rest of deploy/hostinger/ is still synced by hand, see
      # deploy/hostinger/README.md). Copying a file that is already there is harmless: migrate.sh keeps a ledger
      # (public.knight_basins_schema_migrations) and skips every file it has applied.
      - name: Copy Migrations to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 72.62.79.84
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/hostinger/migrations/*.sql"
          target: "/docker/knightbasins/deploy/hostinger/migrations/"
          strip_components: 3

      # Runs the VPS copy of migrate.sh BEFORE the containers restart. It applies only the pending files, each in
      # its own transaction together with its ledger row, so running it again does nothing. If it fails the job
      # stops here: the old containers keep running and the restart step is skipped.
      - name: Apply Database Migrations
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 72.62.79.84
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /docker/knightbasins/deploy/hostinger
            test -f migrate.sh || { echo "migrate.sh is missing on the VPS - copy deploy/hostinger/migrate.sh to /docker/knightbasins/deploy/hostinger/ first"; exit 1; }
            echo "Migration files on the VPS: $(ls -1 migrations/*.sql | wc -l)"
            export KNIGHT_BASINS_API_CONTAINER=knightbasins-api
            export KNIGHT_BASINS_API_ENV_FILE=/docker/knightbasins/.env
            bash migrate.sh
            echo "Database is up to date"

      - name: Restart Docker Containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 72.62.79.84
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            chmod -R 755 /docker/knightbasins/web-dist /docker/knightbasins/api-dist
            docker restart knightbasins-api knightbasins-web

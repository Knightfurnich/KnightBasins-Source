name: Deploy to Hostinger VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 72.62.79.84
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/data/cache/kbsrc
            GIT_SSH_COMMAND="ssh -i /opt/data/bin/.ssh/id_ed25519 -o IdentitiesOnly=yes" git fetch --all && git reset --hard origin/main
            cd /opt/data/cache/kbsrc/artifacts/knight-basins && PORT=3000 NODE_ENV=production ./node_modules/.bin/vite build --mode production
            cd /opt/data/cache/kbsrc/artifacts/api-server && node ./build.mjs
            mkdir -p /docker/knightbasins/web-dist /docker/knightbasins/api-dist
            cp -r /opt/data/cache/kbsrc/artifacts/knight-basins/dist/public/* /docker/knightbasins/web-dist/
            cp -r /opt/data/cache/kbsrc/artifacts/api-server/dist/* /docker/knightbasins/api-dist/
            chmod -R 755 /docker/knightbasins/web-dist /docker/knightbasins/api-dist
            docker restart knightbasins-api knightbasins-web

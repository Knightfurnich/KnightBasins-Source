server {
    listen 80;
    server_name knightbasins.srv1964473.hstgr.cloud;
    root /usr/share/nginx/html;
    index index.html;

    # Traefik terminates TLS and forwards plain HTTP here on the shared
    # "hermes" Docker network. Do not add a listen 443/ssl block; this file
    # is mounted read-only into the knightbasins-web container.

    location ^~ /api/ {
        proxy_pass http://knightbasins-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router routes such as /stone and /quote must resolve to index.html.
    # Private customer & administrative portals: serve SPA index.html with
    # explicit HTTP-level X-Robots-Tag to guarantee no search engine or bot indexes
    # personal quote tokens or customer job progress, while still letting customers
    # open their links directly from LINE or Telegram.
    location ~ ^/(?:admin(?:/.*)?|track|handover|profile)$ {
        try_files $uri /index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Saved quote view carries a customer access token in the query string --
    # exact-match protects the private view while leaving the public /quote builder indexed.
    location = /quote/view {
        try_files $uri /index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived caching for hashed Vite assets.
    location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

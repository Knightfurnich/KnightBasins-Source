# Robots directive per request path, emitted as a real HTTP header.
#
# Two things make this work, and both are easy to get wrong:
#
# 1. The header is declared at `server` level, NOT inside per-route `location`
#    blocks. `try_files $uri $uri/ /index.html` performs an INTERNAL REDIRECT
#    and nginx re-evaluates locations for the target, so an add_header inside
#    the matched location is dropped -- the final response comes from
#    `location /`. A server-level add_header survives the redirect.
# 2. The map keys on `$request_uri`, NOT `$uri`. After that same internal
#    redirect `$uri` has already become `/index.html` for every SPA route, so a
#    `$uri`-keyed map matches only the default and silently tags nothing.
#    `$request_uri` still holds what the client actually asked for, so the
#    query-string suffix has to be tolerated in the pattern.
map $request_uri $knight_x_robots_tag {
    default                                                    "index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1";
    # Private customer portals + admin: never indexed, but still fully openable
    # by the customer clicking the LINE/Telegram link the team sent them.
    ~^/(?:admin(?:/.*)?|track|handover|profile)(?:\?.*)?$      "noindex, nofollow";
    # Saved quote view carries a customer access token; matched exactly so the
    # public /quote builder stays indexable.
    ~^/quote/view(?:\?.*)?$                                    "noindex, nofollow";
}

# The old *.hstgr.cloud hostname is retired: DNS, Traefik and nginx all stopped
# serving it, so the site has exactly one hostname and Google/AI crawlers can no
# longer split one page's signals across two hosts. Anything that still points at
# the legacy hostname (old chat messages, old quotes, old bookmarks) now 404s on
# purpose — the app, the API and /kb/ all live on the canonical domain.

server {
    listen 80;
    server_name knightbasins.com www.knightbasins.com;
    root /usr/share/nginx/html;
    index index.html;

    # Traefik terminates TLS and forwards plain HTTP here on the shared
    # "hermes" Docker network. Do not add a listen 443/ssl block; this file
    # is mounted read-only into the knightbasins-web container.

    # Compression. Without this the whole bundle shipped uncompressed: the JS was
    # 1.74 MB on the wire (456 KB gzipped) and the CSS 383 KB (66 KB gzipped), which
    # is the single biggest cost in mobile LCP. Vary: Accept-Encoding is set so caches
    # do not hand a gzipped body to a client that cannot read it.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    # One URL per page. Without these, /index.html, /stone/ and the www host all
    # answer 200 with the same content, so Google splits one page's signals across
    # several URLs instead of consolidating them on the canonical URL.
    # /api/, /kb/ and /assets/ are left alone: the API and hashed assets are not pages.
    location = /index.html {
        return 301 https://knightbasins.com/;
    }
    if ($host = www.knightbasins.com) {
        rewrite ^(.*)$ https://knightbasins.com$1 permanent;
    }
    # Trailing slashes: /stone/ is the same page as /stone. Built with an explicit
    # https target because Traefik terminates TLS, so nginx itself only ever sees http.
    if ($request_uri ~ ^(?!/api/|/kb/|/assets/)(/.+?)/+(\?.*)?$) {
        return 301 https://knightbasins.com$1$is_args$args;
    }

    location ^~ /api/ {
        proxy_pass http://knightbasins-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security headers for the prerendered HTML. src/app.ts sets its own set, but only on API responses: every page a
    # browser or an AI crawler fetches by URL is answered here, and the live site sent no X-Content-Type-Options,
    # no X-Frame-Options and no Referrer-Policy on any of the 12 routes. `always` so 404s and redirects carry them too.
    # SAMEORIGIN rather than the API's DENY: a saved quote or a workbench view has to open inside our own pages.
    # Strict-Transport-Security is deliberately not set here - Traefik terminates TLS, this server only ever sees http.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Applies to every response that is not served by the (self-contained)
    # hashed-asset location below, including the SPA fallback after redirect.
    add_header X-Robots-Tag $knight_x_robots_tag always;

    # Unknown URLs must be a real 404: the SPA fallback used to answer 200 for every
    # path, so Google spent crawl budget on URLs that do not exist (soft 404s).
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Client-only routes still get the SPA shell: the admin portals and the private
    # customer links are rendered in the browser and are never prerendered.
    location ~ ^/(?:admin|track|profile|handover|quote/view)(?:/|$) {
        try_files /index.html =404;
    }

    # Every other path must be a prerendered page (dist/public/<route>/index.html).
    # The prerendered HTML changes with every deploy, so it is always revalidated;
    # the hashed assets below keep their one-year cache.

    location / {
        try_files $uri $uri/index.html =404;
        # nginx throws away inherited add_header directives in any location that declares its own, so this page block
        # repeats the set: "no-store-ish HTML, indexable, and un-sniffable" is the minimum a prerendered page ships with.
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag $knight_x_robots_tag always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Long-lived caching for hashed Vite assets.
    location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}

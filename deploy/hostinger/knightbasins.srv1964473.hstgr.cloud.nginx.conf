server {
    listen 80;
    listen [::]:80;

    server_name knightbasins.srv1964473.hstgr.cloud;

    root /var/www/knight-basins;
    index index.html;

    # Admin CRUD and storefront catalog API.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router routes such as /stone and /quote must resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived caching for hashed Vite assets.
    location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /robots.txt {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }
}
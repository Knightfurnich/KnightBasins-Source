services:
  db:
    image: postgres:16-alpine
    container_name: knightbasins-db
    restart: unless-stopped
    env_file:
      - .db.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - hermes
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: node:22-alpine
    container_name: knightbasins-api
    restart: unless-stopped
    working_dir: /app
    command: ["node", "--enable-source-maps", "dist/index.mjs"]
    env_file:
      - .env
    volumes:
      - ./api-dist:/app/dist:ro
      - ./uploads:/app/uploads
      # Read-only logical backups (pg_dump) written by backups/knight_db_backup.sh.
      # Only the api service gets this mount; nginx has no view of the directory,
      # so a dump is reachable solely through the authenticated admin route.
      - ./backups:/app/backups:ro
    networks:
      - hermes
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    image: nginx:alpine
    container_name: knightbasins-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./web-dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - hermes
    labels:
      traefik.enable: "true"
      traefik.http.routers.knightbasins.entrypoints: "websecure"
      traefik.http.routers.knightbasins.rule: "Host(`knightbasins.srv1964473.hstgr.cloud`)"
      traefik.http.routers.knightbasins.tls: "true"
      traefik.http.routers.knightbasins.tls.certresolver: "letsencrypt"
      traefik.http.services.knightbasins.loadbalancer.server.port: "80"

networks:
  hermes:
    external: true
    name: hermes-agent-2xwn_default

volumes:
  postgres-data:
